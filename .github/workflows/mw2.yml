name: MW2 development launcher
on:
  push:
    paths: ['games/mw2/**', '.github/workflows/mw2.yml']
  pull_request:
    paths: ['games/mw2/**', '.github/workflows/mw2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: games/mw2
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build native launcher and codec checker
        run: ./launcher/build.ps1
      - name: Test missing and unsupported installations
        run: ./tools/test-launcher.ps1
      - name: Package development launcher
        run: ./tools/package-launcher.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: mw2-development-launcher-not-playable-mod
          path: games/mw2/_releases/0.1.0-dev.1/*
          if-no-files-found: error
