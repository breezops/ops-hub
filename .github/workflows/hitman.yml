name: HITMAN source checks
on:
  push:
    paths: ['games/hitman/**', '.github/workflows/hitman.yml']
  pull_request:
    paths: ['games/hitman/**', '.github/workflows/hitman.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: games/hitman
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone core
        run: |
          cmake -S core -B _build-core -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build _build-core --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test core
        run: |
          & _build-core/Release/coop_tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build redesigned launcher
        run: ./launcher/build.ps1
      - name: Build and test native adapters without game files or SDK
        run: |
          cmake -S tools/native-tests -B _build-native-fixtures -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build _build-native-fixtures --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir _build-native-fixtures -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and test verified absolute entry backend
        # Absolute mode is private/opt-in; exercise its control/refusal fixtures
        # before the independent launcher validation step.
        run: |
          cmake -S tools/native-tests -B _build-absolute-fixtures -G "Visual Studio 17 2022" -A x64 -DCOOP_MINHOOK_ABSOLUTE_ENTRIES=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build _build-absolute-fixtures --config Release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir _build-absolute-fixtures -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test update validation and staging
        run: ./tools/test-launcher.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hitman-launcher-development-build
          path: games/hitman/launcher/bin/
          if-no-files-found: error
